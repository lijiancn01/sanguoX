[package]
name = "sanguox"
version = "0.1.0"
description = "三国群英传 - Windows 单机版（Tauri v2 + Phaser 3）"
authors = ["jian.li"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.82"

[lib]
name = "sanguox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
